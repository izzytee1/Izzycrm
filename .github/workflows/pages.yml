name: Deploy CRM Pages

on:
  push:
    branches: [main]
    paths:
      - 'CRM.V40.EMAIL.MOBILE.REPAIRED.zip'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build multi-file site
        run: |
          rm -rf _site
          mkdir _site
          unzip -q CRM.V40.EMAIL.MOBILE.REPAIRED.zip -d _site
          rm -f _site/CRM.V40.EMAIL.MOBILE.REPAIRED.SINGLE.html _site/quick-view.html
          rm -rf _site/archives
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
