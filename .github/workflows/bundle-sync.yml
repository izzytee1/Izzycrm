name: Bundle Sync

on:
  push:
    branches: [main]
    paths:
      - '.bundle/**'
      - '.github/workflows/bundle-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[bundle-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild staged CRM bundles
        shell: bash
        run: |
          set -euo pipefail
          changed=0
          mkdir -p archives dist

          if [ -f .bundle/pre.complete ] && ls .bundle/pre.part* >/dev/null 2>&1; then
            cat .bundle/pre.part* | base64 -d > archives/CRM.V40.EMAIL.MOBILE.FIXED.PRE-REPAIR.zip
            changed=1
          fi

          if [ -f .bundle/final.complete ] && ls .bundle/final.part* >/dev/null 2>&1; then
            cat .bundle/final.part* | base64 -d > /tmp/crm-final.zip
            cp /tmp/crm-final.zip dist/CRM.V40.EMAIL.MOBILE.REPAIRED.zip
            rm -rf css js mock-data README.txt index.html
            unzip -oq /tmp/crm-final.zip -d .
            changed=1
          fi

          if [ -f .bundle/single.complete ] && ls .bundle/single.part* >/dev/null 2>&1; then
            cat .bundle/single.part* | base64 -d > CRM.V40.EMAIL.MOBILE.REPAIRED.SINGLE.html
            cp CRM.V40.EMAIL.MOBILE.REPAIRED.SINGLE.html quick-view.html
            changed=1
          fi

          if [ "$changed" -eq 0 ]; then
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add archives dist css js mock-data README.txt index.html CRM.V40.EMAIL.MOBILE.REPAIRED.SINGLE.html quick-view.html 2>/dev/null || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Build CRM bundle [bundle-sync]'
          git push
